services:
  secutron:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - type: bind
        source: ${SECUTRON_SCAN_PATH:-.}
        target: /workspace
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

